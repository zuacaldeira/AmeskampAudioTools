# Ameskamp Studio — apex (landing page).
#
# Serves the static catalog from ameskamp-studio/landing/.

server {
    listen 80;
    listen [::]:80;
    server_name ameskamp.studio www.ameskamp.studio;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://ameskamp.studio$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.ameskamp.studio;

    ssl_certificate     /etc/letsencrypt/live/ameskamp.studio/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ameskamp.studio/privkey.pem;
    include /etc/nginx/snippets/ameskamp-ssl-params.conf;

    return 301 https://ameskamp.studio$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ameskamp.studio;

    ssl_certificate     /etc/letsencrypt/live/ameskamp.studio/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ameskamp.studio/privkey.pem;
    include /etc/nginx/snippets/ameskamp-ssl-params.conf;

    root /opt/ameskamp-audio-tools/ameskamp-studio/landing;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache the static asset for a day. The page itself is light HTML
    # and can stay shorter.
    location = /index.html {
        add_header Cache-Control "public, max-age=300";
    }
}
