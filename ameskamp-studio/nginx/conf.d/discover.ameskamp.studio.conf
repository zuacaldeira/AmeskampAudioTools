# Audio Discover — reverse proxy to the audio-discover container.

server {
    listen 80;
    listen [::]:80;
    server_name discover.ameskamp.studio;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name discover.ameskamp.studio;

    ssl_certificate     /etc/letsencrypt/live/discover.ameskamp.studio/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/discover.ameskamp.studio/privkey.pem;
    include /etc/nginx/snippets/ameskamp-ssl-params.conf;

    location / {
        include /etc/nginx/snippets/ameskamp-proxy-params.conf;
        proxy_pass http://127.0.0.1:5005;
    }
}
