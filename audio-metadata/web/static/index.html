<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ameskamp — Audio Metadata</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-primary: #0a0a0f;
    --bg-secondary: #12121a;
    --bg-card: #16161f;
    --bg-elevated: #1c1c28;
    --border: #2a2a3a;
    --border-active: #4a4a6a;
    --text-primary: #e8e8f0;
    --text-secondary: #8888a8;
    --text-muted: #555570;
    --accent: #c4b5fd;
    --accent-dim: #5b4b94;
    --accent-glow: rgba(196, 181, 253, 0.15);
    --accent-strong: #8b5cf6;
    --danger: #f87171;
    --warning: #fbbf24;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg-primary);
    color: var(--text-primary);
    min-height: 100vh;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(196, 181, 253, 0.02) 1px, transparent 1px),
      linear-gradient(90deg, rgba(196, 181, 253, 0.02) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  .app {
    position: relative;
    z-index: 1;
    max-width: 820px;
    margin: 0 auto;
    padding: 48px 24px 40px;
  }

  .footer {
    position: relative;
    z-index: 1;
    text-align: center;
    padding: 24px;
    color: var(--text-muted);
    font-size: 13px;
  }

  .footer a {
    color: var(--text-secondary);
    text-decoration: none;
    transition: color 0.2s;
  }

  .footer a:hover { color: var(--accent); }

  .header {
    margin-bottom: 48px;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 16px;
  }

  .header h1 {
    font-family: 'JetBrains Mono', monospace;
    font-size: 28px;
    font-weight: 600;
    letter-spacing: -0.5px;
    color: var(--text-primary);
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .header h1 .business-name {
    font-family: 'DM Sans', sans-serif;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #ffffff;
  }

  .header h1 .brand {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .header-actions {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
    margin-top: 4px;
  }

  .header h1 .icon {
    width: 36px;
    height: 36px;
    background: linear-gradient(135deg, var(--accent), var(--accent-strong));
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    color: #0a0a0f;
    box-shadow: 0 0 24px var(--accent-glow);
  }

  .header p {
    margin-top: 8px;
    color: var(--text-secondary);
    font-size: 15px;
    padding-left: 48px;
  }

  .dropzone {
    position: relative;
    border: 2px dashed var(--border);
    border-radius: 16px;
    padding: 56px 32px;
    text-align: center;
    cursor: pointer;
    transition: all 0.3s ease;
    background: var(--bg-secondary);
    margin-bottom: 32px;
  }

  .dropzone:hover, .dropzone.drag-over {
    border-color: var(--accent);
    background: var(--accent-glow);
  }

  .dropzone.drag-over { transform: scale(1.01); }

  .dropzone.has-file {
    border-color: var(--accent-dim);
    border-style: solid;
    padding: 24px 32px;
  }

  .dropzone-prompt {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }

  .dropzone-prompt svg {
    width: 48px;
    height: 48px;
    color: var(--text-muted);
    transition: color 0.3s;
  }

  .dropzone:hover .dropzone-prompt svg { color: var(--accent); }

  .dropzone-prompt .main-text {
    font-size: 16px;
    font-weight: 500;
    color: var(--text-secondary);
  }

  .dropzone-prompt .sub-text {
    font-size: 13px;
    color: var(--text-muted);
    font-family: 'JetBrains Mono', monospace;
  }

  .dropzone input[type="file"] { display: none; }

  .file-info {
    display: flex;
    align-items: center;
    gap: 16px;
    width: 100%;
  }

  .file-icon {
    width: 44px;
    height: 44px;
    border-radius: 10px;
    background: var(--accent-glow);
    border: 1px solid var(--accent-dim);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .file-icon svg {
    width: 22px;
    height: 22px;
    color: var(--accent);
  }

  .file-details {
    flex: 1;
    min-width: 0;
    text-align: left;
  }

  .file-details .name {
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    font-weight: 500;
    color: var(--text-primary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .file-details .meta {
    font-size: 13px;
    color: var(--text-muted);
    margin-top: 2px;
  }

  .file-remove {
    width: 36px;
    height: 36px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-muted);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
    flex-shrink: 0;
  }

  .file-remove:hover {
    border-color: var(--danger);
    color: var(--danger);
    background: rgba(248, 113, 113, 0.1);
  }

  .process-btn {
    width: 100%;
    height: 54px;
    border: none;
    border-radius: 12px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.5px;
    cursor: pointer;
    transition: all 0.3s;
    position: relative;
    overflow: hidden;
    background: linear-gradient(135deg, var(--accent-strong), var(--accent));
    color: #0a0a0f;
    box-shadow: 0 4px 24px rgba(139, 92, 246, 0.2);
    margin-bottom: 32px;
  }

  .process-btn:hover:not(:disabled) {
    transform: translateY(-1px);
    box-shadow: 0 6px 32px rgba(139, 92, 246, 0.3);
  }

  .process-btn:active:not(:disabled) { transform: translateY(0); }

  .process-btn:disabled {
    background: var(--bg-elevated);
    color: var(--text-muted);
    box-shadow: none;
    cursor: not-allowed;
  }

  .process-btn.processing {
    background: var(--bg-elevated);
    color: var(--accent);
    box-shadow: none;
  }

  .process-btn .progress-bar {
    position: absolute;
    left: 0;
    bottom: 0;
    height: 3px;
    background: var(--accent);
    width: 0%;
    transition: width 0.3s ease;
  }

  .results {
    display: none;
    animation: fadeUp 0.4s ease;
  }

  .results.show { display: block; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .results-card {
    background: var(--bg-card);
    border: 1px solid var(--accent-dim);
    border-radius: 16px;
    padding: 28px;
    margin-bottom: 20px;
  }

  .results-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
    gap: 12px;
  }

  .results-title {
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--accent);
  }

  .copy-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 8px 14px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--bg-elevated);
    color: var(--text-secondary);
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s ease;
  }

  .copy-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
    background: var(--accent-glow);
  }

  .copy-btn svg {
    width: 14px;
    height: 14px;
  }

  .cover-row {
    display: flex;
    gap: 20px;
    margin-bottom: 24px;
    align-items: flex-start;
  }

  .cover-row.no-cover { display: none; }

  .cover-art {
    width: 160px;
    height: 160px;
    border-radius: 12px;
    overflow: hidden;
    border: 1px solid var(--border);
    background: var(--bg-secondary);
    flex-shrink: 0;
  }

  .cover-art img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .cover-meta {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 4px;
    padding-top: 6px;
  }

  .cover-meta .label {
    font-size: 12px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.8px;
    font-family: 'JetBrains Mono', monospace;
  }

  .cover-meta .value {
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    color: var(--text-primary);
  }

  .stats-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-bottom: 24px;
  }

  @media (max-width: 700px) {
    .stats-grid { grid-template-columns: repeat(2, 1fr); }
  }

  .stat {
    background: var(--bg-secondary);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 14px;
  }

  .stat .label {
    font-size: 11px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.8px;
    font-family: 'JetBrains Mono', monospace;
    margin-bottom: 6px;
  }

  .stat .value {
    font-family: 'JetBrains Mono', monospace;
    font-size: 16px;
    font-weight: 600;
    color: var(--text-primary);
  }

  .stat .value.accent { color: var(--accent); }

  .section-title {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 1.2px;
    color: var(--text-secondary);
    margin-bottom: 10px;
  }

  .tags-table {
    display: grid;
    grid-template-columns: max-content 1fr;
    gap: 8px 20px;
    background: var(--bg-secondary);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px 18px;
  }

  .tags-table .tag-key {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.6px;
    align-self: center;
  }

  .tags-table .tag-value {
    font-size: 14px;
    color: var(--text-primary);
    word-break: break-word;
  }

  .empty-note {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    color: var(--text-muted);
    padding: 16px;
    text-align: center;
    background: var(--bg-secondary);
    border: 1px dashed var(--border);
    border-radius: 10px;
  }

  .error-msg {
    display: none;
    background: rgba(248, 113, 113, 0.1);
    border: 1px solid rgba(248, 113, 113, 0.3);
    border-radius: 10px;
    padding: 16px 20px;
    color: var(--danger);
    font-size: 14px;
    margin-bottom: 24px;
    font-family: 'JetBrains Mono', monospace;
  }

  .error-msg.show { display: block; }

  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg-secondary); border-radius: 3px; }
  ::-webkit-scrollbar-thumb { background: var(--border-active); border-radius: 3px; }
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div>
      <h1>
        <span class="icon">&#9776;</span>
        <span class="brand">
          <span class="business-name">Ameskamp</span>
          Audio Metadata
        </span>
      </h1>
      <p>Upload an audio file and inspect its tags, stream info, and cover art.</p>
    </div>
  </div>

  <div class="dropzone" id="dropzone">
    <div class="dropzone-prompt" id="dropPrompt">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
        <polyline points="17 8 12 3 7 8"/>
        <line x1="12" y1="3" x2="12" y2="15"/>
      </svg>
      <span class="main-text">Drop audio file here or click to browse</span>
      <span class="sub-text">MP3 · FLAC · WAV · OGG · OPUS · M4A · AIFF · up to 500 MB</span>
    </div>
    <div class="file-info" id="fileInfo" style="display:none">
      <div class="file-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 18V5l12-2v13"/>
          <circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>
        </svg>
      </div>
      <div class="file-details">
        <div class="name" id="fileName"></div>
        <div class="meta" id="fileMeta"></div>
      </div>
      <button class="file-remove" id="fileRemove" title="Remove file">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>
    <input type="file" id="fileInput" accept="audio/*,.wav,.mp3,.flac,.ogg,.opus,.m4a,.aac,.wma,.aiff,.aif,.ape,.mpc">
  </div>

  <div class="error-msg" id="errorMsg"></div>

  <button class="process-btn" id="processBtn" disabled>
    <span id="btnText">Select a file to begin</span>
    <div class="progress-bar" id="progressBar"></div>
  </button>

  <div class="results" id="results">
    <div class="results-card">
      <div class="results-header">
        <div class="results-title">Metadata</div>
        <button class="copy-btn" id="copyJsonBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
            <path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/>
          </svg>
          <span id="copyJsonLabel">Copy JSON</span>
        </button>
      </div>

      <div class="cover-row" id="coverRow">
        <div class="cover-art"><img id="coverImg" alt="Cover art"></div>
        <div class="cover-meta">
          <span class="label">Cover art</span>
          <span class="value" id="coverMime">—</span>
          <span class="value" id="coverSize">—</span>
        </div>
      </div>

      <div class="stats-grid">
        <div class="stat"><div class="label">Duration</div><div class="value accent" id="statDuration">—</div></div>
        <div class="stat"><div class="label">Bitrate</div><div class="value" id="statBitrate">—</div></div>
        <div class="stat"><div class="label">Sample rate</div><div class="value" id="statSampleRate">—</div></div>
        <div class="stat"><div class="label">Channels</div><div class="value" id="statChannels">—</div></div>
      </div>

      <div class="section-title">Tags</div>
      <div id="tagsContainer"></div>
    </div>
  </div>
</div>

<footer class="footer">
  Built by <a href="https://github.com/zuacaldeira" target="_blank" rel="noopener">Zua Caldeira</a>
</footer>

<script>
const $ = id => document.getElementById(id);

const dropzone = $('dropzone');
const fileInput = $('fileInput');
const dropPrompt = $('dropPrompt');
const fileInfo = $('fileInfo');
const processBtn = $('processBtn');
const btnText = $('btnText');
const progressBar = $('progressBar');
const results = $('results');
const errorMsg = $('errorMsg');

let selectedFile = null;
let lastMetadata = null;

function formatDuration(sec) {
  if (sec == null) return '—';
  const total = Math.round(sec);
  const h = Math.floor(total / 3600);
  const m = Math.floor((total % 3600) / 60);
  const s = total % 60;
  if (h) return `${h}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
  return `${m}:${String(s).padStart(2, '0')}`;
}

function formatSize(bytes) {
  if (bytes == null) return '—';
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
  return (bytes / (1024 * 1024)).toFixed(2) + ' MB';
}

function setFile(file) {
  if (!file) return;
  selectedFile = file;
  dropPrompt.style.display = 'none';
  fileInfo.style.display = 'flex';
  $('fileName').textContent = file.name;
  $('fileMeta').textContent = formatSize(file.size);
  dropzone.classList.add('has-file');
  processBtn.disabled = false;
  btnText.textContent = 'Extract Metadata';
  results.classList.remove('show');
  errorMsg.classList.remove('show');
}

function clearFile(e) {
  if (e) e.stopPropagation();
  selectedFile = null;
  fileInput.value = '';
  dropPrompt.style.display = 'flex';
  fileInfo.style.display = 'none';
  dropzone.classList.remove('has-file');
  processBtn.disabled = true;
  btnText.textContent = 'Select a file to begin';
  results.classList.remove('show');
  errorMsg.classList.remove('show');
}

dropzone.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', e => { if (e.target.files[0]) setFile(e.target.files[0]); });
$('fileRemove').addEventListener('click', clearFile);

dropzone.addEventListener('dragover', e => { e.preventDefault(); dropzone.classList.add('drag-over'); });
dropzone.addEventListener('dragleave', () => dropzone.classList.remove('drag-over'));
dropzone.addEventListener('drop', e => {
  e.preventDefault();
  dropzone.classList.remove('drag-over');
  if (e.dataTransfer.files[0]) setFile(e.dataTransfer.files[0]);
});

$('copyJsonBtn').addEventListener('click', () => {
  if (!lastMetadata) return;
  const clean = JSON.parse(JSON.stringify(lastMetadata));
  if (clean.cover) delete clean.cover.data_url;
  navigator.clipboard.writeText(JSON.stringify(clean, null, 2)).then(() => {
    const label = $('copyJsonLabel');
    const orig = label.textContent;
    label.textContent = 'Copied!';
    setTimeout(() => { label.textContent = orig; }, 1500);
  });
});

function renderTags(tags) {
  const container = $('tagsContainer');
  container.innerHTML = '';
  const keys = Object.keys(tags || {});
  if (keys.length === 0) {
    const note = document.createElement('div');
    note.className = 'empty-note';
    note.textContent = 'No tags found in this file.';
    container.appendChild(note);
    return;
  }
  const table = document.createElement('div');
  table.className = 'tags-table';
  keys.sort().forEach(k => {
    const keyEl = document.createElement('div');
    keyEl.className = 'tag-key';
    keyEl.textContent = k;
    const valEl = document.createElement('div');
    valEl.className = 'tag-value';
    valEl.textContent = tags[k];
    table.appendChild(keyEl);
    table.appendChild(valEl);
  });
  container.appendChild(table);
}

processBtn.addEventListener('click', async () => {
  if (!selectedFile || processBtn.disabled) return;

  errorMsg.classList.remove('show');
  results.classList.remove('show');

  processBtn.disabled = true;
  processBtn.classList.add('processing');
  btnText.textContent = 'Reading…';

  let progress = 0;
  const progressInterval = setInterval(() => {
    progress = Math.min(progress + (90 - progress) * 0.1, 90);
    progressBar.style.width = progress + '%';
  }, 80);

  const formData = new FormData();
  formData.append('file', selectedFile);

  try {
    const res = await fetch('/api/metadata', { method: 'POST', body: formData });
    const data = await res.json();

    clearInterval(progressInterval);
    progressBar.style.width = '100%';

    if (!res.ok) throw new Error(data.error || 'Failed to read metadata');

    lastMetadata = data;

    const s = data.stream || {};
    $('statDuration').textContent = formatDuration(s.duration_seconds);
    $('statBitrate').textContent = s.bitrate_bps ? Math.round(s.bitrate_bps / 1000) + ' kbps' : '—';
    $('statSampleRate').textContent = s.sample_rate_hz ? s.sample_rate_hz.toLocaleString() + ' Hz' : '—';
    const chLabel = { 1: 'mono', 2: 'stereo' }[s.channels];
    $('statChannels').textContent = s.channels ? `${s.channels}${chLabel ? ' (' + chLabel + ')' : ''}` : '—';

    if (data.cover && data.cover.data_url) {
      $('coverRow').classList.remove('no-cover');
      $('coverImg').src = data.cover.data_url;
      $('coverMime').textContent = data.cover.mime || '';
      $('coverSize').textContent = formatSize(data.cover.size_bytes);
    } else {
      $('coverRow').classList.add('no-cover');
    }

    renderTags(data.tags || {});
    results.classList.add('show');

  } catch (err) {
    clearInterval(progressInterval);
    errorMsg.textContent = err.message;
    errorMsg.classList.add('show');
  } finally {
    setTimeout(() => { progressBar.style.width = '0%'; }, 400);
    processBtn.disabled = false;
    processBtn.classList.remove('processing');
    btnText.textContent = 'Extract Metadata';
  }
});
</script>
</body>
</html>
